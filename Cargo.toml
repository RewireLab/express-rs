[package]
name = "express-rs"
version = "0.1.0"
edition = "2021"
description = "Express.js-style HTTP framework, rebuilt in Rust"
license = "MIT"
repository = "https://github.com/RewireLab/express-rs"
keywords = ["http", "web", "framework", "express"]
categories = ["web-programming::http-server"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
flate2 = "1"
brotli = "8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time"] }
flate2 = "1"

[[bin]]
name = "express-rs"
path = "src/main.rs"
